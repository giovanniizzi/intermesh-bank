quarkus.http.port=8080

ledger-service/mp-rest/url=http://intermesh-ledger
fraud-service/mp-rest/url=http://fraud-analytics

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c] (%t) %s%e%n

quarkus.http.session.enabled=true
quarkus.http.session.cookie-name=JSESSIONID
