quarkus.http.port=8080

mp.jwt.verify.publickey.location=${mp.jwt.verify.issuer}/protocol/openid-connect/certs
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.clock.skew=60
smallrye.jwt.required.claims=iss,sub,exp
quarkus.smallrye-jwt.blocking-authentication=true
# Use configured JWKS instead of automatically generated development keys.
%dev.mp.jwt.verify.publickey=NONE
%test.mp.jwt.verify.publickey=NONE

ledger-service/mp-rest/url=http://intermesh-ledger
fraud-service/mp-rest/url=http://fraud-analytics

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c] (%t) %s%e%n

quarkus.http.session.enabled=true
quarkus.http.session.cookie-name=JSESSIONID
quarkus.http.session.timeout=5m
quarkus.http.session.persistent=true
quarkus.http.session.cookie-secure=false
quarkus.http.session.cookie-http-only=true
quarkus.http.session.cookie-same-site=None
