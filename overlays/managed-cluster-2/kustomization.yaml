apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../manifests
  - ../../manifests/ossm/destination-rules/network2

images:
  - name: intermesh-orchestrator
    newName: example.invalid/intermesh-orchestrator
    newTag: "1.0"
  - name: intermesh-ui
    newName: example.invalid/intermesh-ui
    newTag: "1.0"
  - name: intermesh-ledger
    newName: example.invalid/intermesh-ledger
    newTag: "1.0"
  - name: fraud-analytics
    newName: example.invalid/fraud-analytics
    newTag: "1.0"

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: intermesh-orchestrator
        namespace: intermesh-backend
      spec:
        template:
          spec:
            containers:
              - name: orchestrator
                env:
                  - name: NETWORK
                    value: network2
