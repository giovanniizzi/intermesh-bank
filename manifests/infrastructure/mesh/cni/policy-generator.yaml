apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: intermesh-istio-cni-generator
placementBindingDefaults:
  name: binding-intermesh-istio-cni
policyDefaults:
  namespace: open-cluster-management-policies
  remediationAction: enforce
  complianceType: musthave
  pruneObjectBehavior: None
  recreateOption: None
  ignorePending: false
  placement:
    placementName: placement-all-clusters
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: intermesh-ossm-operator
      namespace: open-cluster-management-policies
      compliance: Compliant
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: intermesh-infra-ns-ingress
      namespace: open-cluster-management-policies
      compliance: Compliant
policies:
  - name: intermesh-istio-cni
    manifests:
      - path: source
