apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: istio-eastwestgateway-service-account
        namespace: istio-east-west
        labels:
          topology.istio.io/network: network1
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: istio-eastwestgateway
        namespace: istio-east-west
        labels:
          topology.istio.io/network: network1
      spec:
        selector:
          matchLabels:
            topology.istio.io/network: network1
        template:
          metadata:
            labels:
              topology.istio.io/network: network1
          spec:
            containers:
              - name: istio-proxy
                env:
                  - name: ISTIO_META_REQUESTED_NETWORK_VIEW
                    value: network1
  - patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: istio-eastwestgateway
        namespace: istio-east-west
        labels:
          topology.istio.io/network: network1
      spec:
        selector:
          matchLabels:
            topology.istio.io/network: network1
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: istio-eastwestgateway
        namespace: istio-east-west
        labels:
          topology.istio.io/network: network1
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: istio-eastwestgateway
        namespace: istio-east-west
        labels:
          topology.istio.io/network: network1
      spec:
        selector:
          topology.istio.io/network: network1
