apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: intermesh-eastwest-network1-generator
placementBindingDefaults:
  name: binding-intermesh-eastwest-network1
policyDefaults:
  namespace: open-cluster-management-policies
  remediationAction: enforce
  complianceType: musthave
  pruneObjectBehavior: None
  recreateOption: None
  ignorePending: false
  placement:
    placementName: placement-intermesh-network1
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: intermesh-istio-network1
      namespace: open-cluster-management-policies
      compliance: Compliant
policies:
  - name: intermesh-eastwest-network1
    manifests:
      - path: network1
