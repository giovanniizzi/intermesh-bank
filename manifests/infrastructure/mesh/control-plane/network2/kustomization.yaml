apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - patch: |-
      apiVersion: sailoperator.io/v1
      kind: Istio
      metadata:
        name: default
      spec:
        values:
          global:
            multiCluster:
              clusterName: cluster2
            network: network2
