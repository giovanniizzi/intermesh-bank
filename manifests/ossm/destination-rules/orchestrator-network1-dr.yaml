apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: intermesh-orchestrator-dr-network1
  namespace: intermesh-backend
spec:
  host: intermesh-orchestrator.intermesh-backend.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpCookie:
          name: network1.session
          ttl: 0s