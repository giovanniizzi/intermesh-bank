apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: orchestrator-session
  namespace: open-cluster-management-policies
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: config-policy-orchestrator-session
        spec:
          remediationAction: enforce
          namespaceSelector:
            exclude:
              - kube-*
              - openshift-*
              - default
            include:
              - istio-east-west
              - istio-ingress
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.istio.io/v1alpha3
                kind: Gateway
                metadata:
                  name: east-west-https-gateway
                  namespace: istio-ingress
                spec:
                  selector:
                    istio: eastwestgateway
                  servers:
                    - port:
                        number: 15443
                        name: https-tls
                        protocol: HTTPS
                      tls:
                        mode: ISTIO_MUTUAL
                      hosts:
                        - intermesh-orchestrator.session.intermesh.com
                        - '*.intermesh-orchestrator.intermesh-backend.svc.cluster.local'
            - complianceType: musthave
              apiVersion: networking.istio.io/v1
              kind: VirtualService
              metadata:
                name: quarkus-eastwest-vs
                namespace: istio-east-west
              spec:
                gateways:
                  - east-west-https-gateway
                hosts:
                  - intermesh-orchestrator.session.intermesh.com
                http:
                  - match:
                      - uri:
                          prefix: /api
                    route:
                      - destination:
                          host: intermesh-orchestrator.intermesh-backend.svc.cluster.local
                          port:
                            number: 80
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-all-clusters
  namespace: open-cluster-management-policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ossm-enabled: "true"
      tolerations:
        - key: cluster.open-cluster-management.io/unavailable
          operator: Exists
        - key: cluster.open-cluster-management.io/unreachable
          operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-istio-cross-gateway
  namespace: open-cluster-management-policies
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: istio-gateway
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: placement-all-clusters