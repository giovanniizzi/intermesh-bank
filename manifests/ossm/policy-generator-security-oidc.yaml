apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: intermesh-security-oidc-generator
placementBindingDefaults:
  name: binding-intermesh-security-oidc
policyDefaults:
  namespace: open-cluster-management-policies
  remediationAction: inform
  complianceType: musthave
  pruneObjectBehavior: None
  recreateOption: None
  ignorePending: false
  placement:
    placementName: placement-all-clusters
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: intermesh-ossm-operator
      namespace: open-cluster-management-policies
      compliance: Compliant
policies:
  - name: intermesh-security-oidc
    manifests:
      - path: jwt-request-authentication.yaml
      - path: jwt-authorization-policy.yaml
