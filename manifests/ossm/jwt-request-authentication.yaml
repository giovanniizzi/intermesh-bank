apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: jwt-keycloak-auth
  namespace: intermesh-backend
spec:
  selector:
    matchLabels:
      app: intermesh-orchestrator
  jwtRules:
  - issuer: "https://sso.apps.cluster-l974n.dynamic.redhatworkshops.io/realms/intermesh-bank"
    jwksUri: "https://sso.apps.cluster-l974n.dynamic.redhatworkshops.io/realms/intermesh-bank/protocol/openid-connect/certs"
    forwardOriginalToken: true