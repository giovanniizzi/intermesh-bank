apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: intermesh-security-static-generator
placementBindingDefaults:
  name: binding-intermesh-security-static
policyDefaults:
  namespace: open-cluster-management-policies
  remediationAction: inform
  complianceType: musthave
  pruneObjectBehavior: None
  recreateOption: None
  ignorePending: false
  placement:
    placementName: placement-all-clusters
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: intermesh-ossm-operator
      namespace: open-cluster-management-policies
      compliance: Compliant
policies:
  - name: intermesh-security-static
    manifests:
      - path: policies/deny-orchestrator-without-jwt.yaml
