apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-orchestrator
  namespace: intermesh-backend
spec:
  selector:
    matchLabels:
      app: intermesh-orchestrator
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces: ["istio-ingress", "istio-east-west"]