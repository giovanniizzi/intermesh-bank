apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: restrict-egress-to-db
  namespace: intermesh-backend
spec:
  action: DENY
  rules:
  - to:
    - operation:
        hosts: ["postgres.example.invalid"]
    from:
    - source:
        notPrincipals: ["cluster.local/ns/intermesh-backend/sa/intermesh-ledger-sa"]