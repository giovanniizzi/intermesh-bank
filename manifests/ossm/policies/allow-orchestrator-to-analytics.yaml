apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: rbac-fraud-analytics
  namespace: intermesh-backend
spec:
  selector:
    matchLabels:
      app: fraud-analytics
  action: ALLOW
  rules:
  - from:
    - source:
        principals: 
          - "cluster.local/ns/intermesh-backend/sa/intermesh-orchestrator-sa"
          - "cluster.local/ns/istio-east-west/sa/istio-eastwestgateway-service-account"