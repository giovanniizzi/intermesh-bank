apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: intermesh-routing-network2-generator
placementBindingDefaults:
  name: binding-intermesh-routing-network2
policyDefaults:
  namespace: open-cluster-management-policies
  remediationAction: inform
  complianceType: musthave
  pruneObjectBehavior: None
  recreateOption: None
  ignorePending: false
  placement:
    placementName: placement-intermesh-network2
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: intermesh-ingress-network2
      namespace: open-cluster-management-policies
      compliance: Compliant
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: istio-gateway
      namespace: open-cluster-management-policies
      compliance: Compliant
policies:
  - name: intermesh-routing-network2
    manifests:
      - path: virtual-service.yaml
