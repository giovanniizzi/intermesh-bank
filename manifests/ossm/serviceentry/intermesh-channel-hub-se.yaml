apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: intermesh-channel-hub-se
  namespace: intermesh-backend
spec:
  hosts:
    - intermesh-channel-hub.intermesh-backend.svc.cluster.local
  location: MESH_INTERNAL
  ports:
    - name: http
      number: 80
      protocol: HTTP
      targetPort: 8080
  resolution: DNS
  subjectAltNames:
    - 'spiffe://cluster.local/ns/intermesh-backend/sa/intermesh-channel-hub-sa'
    - 'spiffe://cluster.local/ns/istio-east-west/sa/istio-eastwestgateway-service-account'
  workloadSelector:
    labels:
      app: intermesh-channel-hub