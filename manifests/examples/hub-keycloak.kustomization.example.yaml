# Copy to .local/hub-keycloak/kustomization.yaml.
# Replace both local test origins before provisioning the realm.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../manifests/keycloak

patches:
  - target:
      group: k8s.keycloak.org
      version: v2alpha1
      kind: KeycloakRealmImport
      name: intermesh-bank-realm-import
      namespace: keycloak
    patch: |-
      - op: test
        path: /spec/realm/clients/0/clientId
        value: intermesh-frontend
      - op: replace
        path: /spec/realm/clients/0/redirectUris
        value:
          - https://bank-network1-local.example.invalid/*
          - https://bank-network2-local.example.invalid/*
      - op: replace
        path: /spec/realm/clients/0/webOrigins
        value:
          - https://bank-network1-local.example.invalid
          - https://bank-network2-local.example.invalid
      - op: replace
        path: /spec/realm/clients/0/attributes/post.logout.redirect.uris
        value: "https://bank-network1-local.example.invalid##https://bank-network2-local.example.invalid"
