apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../namespaces
  - ../../cni
  - ../../control-plane/network1
  - ../../gateways/ingress
  - ../../gateways/eastwest/network1

replacements:
  - source:
      group: sailoperator.io
      version: v1
      kind: Istio
      name: default
      fieldPath: spec.values.global.network
    targets:
      - select:
          version: v1
          kind: Namespace
          name: istio-system
        fieldPaths:
          - metadata.labels.[topology.istio.io/network]
        options:
          create: true
