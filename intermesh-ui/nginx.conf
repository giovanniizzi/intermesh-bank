# Enterprise Nginx Configuration - Hardened for OpenShift Non-Root Execution

# Run in the foreground inside the container layer
daemon off;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Include standard MIME types mapping
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Redirect standard cache buffers to writable /tmp directory space
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Standard W3C access logs format redirecting directly to stdout
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        # Non-privileged port matching OpenShift secure perimeters
        listen 8080;
        server_name localhost;

        # Source root containing our static HTML/JS banking interface
        root /usr/share/nginx/html;
        index index.html;

        # Gzip Compression to minimize bandwidth transmission overhead
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml;
        gzip_min_length 1000;

        # Core Routing Configuration
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Prevent browser caching on dynamic operational scripts (app.js)
        location ~* \.(js)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # Cache control optimizations for static styling sheets
        location ~* \.(css|ico|png|jpg|jpeg|svg|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Security Headers injection guarding the browser perimeter
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}