# Copy to .local/prerequisites/keycloak/kustomization.yaml.
# Realm settings are inherited from the public base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- "../../../applications/prerequisites/dependencies/keycloak"
patches:
- target:
    group: k8s.keycloak.org
    version: v2beta1
    kind: KeycloakRealmImport
    name: intermesh-bank-realm-import
    namespace: rhbk
  patch: |
    - op: test
      path: "/spec/realm/clients/0/clientId"
      value: intermesh-frontend
